<!doctype html>
<!-- Every gauge look, big (tach) and small, with test values. Open http://127.0.0.1:5560/tests/looks.html
     window.__edges() lists any canvas whose drawing touches its edge (= something would be cut off). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../style.css">
<style>
  html, body { overflow: auto; height: auto; display: block; padding: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 230px), 1fr)); gap: 8px; }
  .cell { border: 1px solid var(--line); padding: 4px; }
  .cell b { font: 10px var(--mono); color: var(--dim); letter-spacing: .1em; }
  .big { width: 100%; aspect-ratio: var(--ar, 1.15); display: block; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 4px; }
  .small { width: 100%; aspect-ratio: var(--sar, 1.25); display: block; }
</style>
<div class="grid" id="grid"></div>
<script type="module">
  import { Gauge, SPECS, LOOKS } from '../js/gauges.js';
  const gauges = [];
  for (const look of LOOKS) {
    const cell = document.createElement('div'); cell.className = 'cell';
    cell.innerHTML = `<b>${look}</b><canvas class="big"></canvas><div class="row"><canvas class="small"></canvas><canvas class="small"></canvas><canvas class="small"></canvas></div>`;
    document.getElementById('grid').append(cell);
    const [big, ...small] = cell.querySelectorAll('canvas');
    gauges.push({ look, g: new Gauge(big, SPECS.rpm), v: 6900, big: true });
    ['boost', 'coolant', 'afr'].forEach((k, i) => gauges.push({ look, g: new Gauge(small[i], SPECS[k]), v: { boost: 24.5, coolant: 255, afr: 9.2 }[k] }));
  }
  // values near the top of each scale, so needles and bars reach their furthest point
  window.__v = 1;   // 1 = near max, 0 = min
  const opts = (look) => ({ look, glow: 1.5, bright: 1.3, neon: '#ff263e', dial: null, gear: '6', speed: 188, lamps: ['KNOCK', 'HOT'] });
  function draw() {
    for (const x of gauges) { const s = x.g.spec, val = window.__v ? x.v : s.min; x.g.pos = val; x.g.vel = 0; x.g.draw(val, 0.016, opts(x.look)); }
  }
  window.__draw = draw;
  // Looks for drawn pixels in a 2-pixel border: anything there is being cut off by the canvas edge.
  window.__edges = () => {
    draw();
    const bad = [];
    for (const x of gauges) {
      const c = x.g.c, ctx = c.getContext('2d'), { width: w, height: h } = c;
      const strips = [ctx.getImageData(0, 0, w, 2), ctx.getImageData(0, h - 2, w, 2), ctx.getImageData(0, 0, 2, h), ctx.getImageData(w - 2, 0, 2, h)];
      let hits = 0;
      for (const s of strips) for (let i = 3; i < s.data.length; i += 4) if (s.data[i] > 40) hits++;
      if (hits > 2) bad.push(`${x.look} ${x.big ? 'big' : x.g.spec.title} (${hits} px at edge)`);
    }
    return bad;
  };
  draw(); setInterval(draw, 200);
</script>
