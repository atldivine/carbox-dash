# Builds an UNSIGNED CarboxDash.ipa on a GitHub macOS runner. Sign + install it on Windows with
# Sideloadly (your Apple ID, entered in Sideloadly). Run from the Actions tab or `gh workflow run ios`.
name: ios
on:
  workflow_dispatch:
  push:
    paths: ["ios/**", "js/**", "index.html", "style.css", "data/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to publish the .ipa as a release
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript tests (OBD driver, adapters, diagnostics + performance maths, latency)
        run: |
          node --version
          node tests/elm.test.mjs
          node tests/adapters.test.mjs
          node tests/perf.test.mjs
          node tests/can.test.mjs
          node tests/drift.test.mjs
          node tests/gear.test.mjs
          node tests/weaklink.test.mjs
          node tests/latency.test.mjs

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: |
          bash sync-web.sh
          xcodegen

      - name: Build (no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project CarboxDash.xcodeproj -scheme CarboxDash -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:|\*\* BUILD" build.log; exit 1; }
          grep -E "error:|\*\* BUILD" build.log

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CarboxDash.app Payload/
          ls Payload/CarboxDash.app/PlugIns || true
          zip -qry CarboxDash.ipa Payload
          ls -lh CarboxDash.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CarboxDash-ipa
          path: ios/CarboxDash.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ios/build.log

      # A direct, phone-friendly download link: Releases > "Carbox Dash (unsigned IPA, latest)".
      - name: Publish the .ipa as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ipa-latest --cleanup-tag -y || true
          gh release create ipa-latest ios/CarboxDash.ipa --target "$GITHUB_SHA" \
            --title "Carbox Dash (unsigned IPA, latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Unsigned: sign and install it with Sideloadly (your Apple ID)."
